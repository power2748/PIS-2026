worker_processes auto;
 
events {
    worker_connections 1024;
}
 
http {
 
    # Upstream-серверы (микросервисы)
    upstream order_service {
        server order-service:8001;
        keepalive 32;
    }
 
    upstream kitchen_service {
        server kitchen-service:8002;
        keepalive 32;
    }
 
    upstream payment_service {
        server payment-service:8003;
        keepalive 32;
    }
 
    upstream notification_service {
        server notification-service:8004;
        keepalive 16;
    }
 
    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;
 
    server {
        listen 80;
        server_name _;
 
        # Заголовки безопасности
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
 
        # ── Order Service ─────────────────────────────────────────
        location /api/orders {
            limit_req zone=api burst=20 nodelay;
            proxy_pass         http://order_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 30s;
 
            # Передаём Idempotency-Key без изменений
            proxy_pass_request_headers on;
        }
 
        # ── Kitchen Service ───────────────────────────────────────
        location /api/kitchen {
            proxy_pass         http://kitchen_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_read_timeout 30s;
        }
 
        # ── Payment Service ───────────────────────────────────────
        location /api/payments {
            limit_req zone=api burst=10 nodelay;
            proxy_pass         http://payment_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_read_timeout 60s;   # дольше из-за эквайринга
        }
 
        # ── Health checks (агрегированный) ───────────────────────
        location /health {
            access_log off;
            return 200 '{"gateway":"ok"}';
            add_header Content-Type application/json;
        }
 
        # ── Swagger UI каждого сервиса ────────────────────────────
        location /docs/orders {
            proxy_pass http://order_service/docs;
        }
 
        location /docs/kitchen {
            proxy_pass http://kitchen_service/docs;
        }
 
        location /docs/payments {
            proxy_pass http://payment_service/docs;
        }
    }
}